<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">

  <style>
    .mono  { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
    .sans  { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }

    /* terminal lines type in one by one */
    .line  { opacity: 0; animation: reveal 0.01s linear forwards; }
    .l1 { animation-delay: 0.4s; }
    .l2 { animation-delay: 1.0s; }
    .l3 { animation-delay: 1.6s; }
    .l4 { animation-delay: 2.2s; }
    .l5 { animation-delay: 2.8s; }
    .l6 { animation-delay: 3.4s; }
    @keyframes reveal { to { opacity: 1; } }

    /* typing mask for each line */
    .type { animation: typing 0.5s steps(28, end) forwards; }
    .t1 { animation-delay: 0.4s; }
    .t2 { animation-delay: 1.0s; }
    .t3 { animation-delay: 1.6s; }
    .t4 { animation-delay: 2.2s; }
    .t5 { animation-delay: 2.8s; }
    .t6 { animation-delay: 3.4s; }
    @keyframes typing { from { width: 0; } to { width: 400px; } }

    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* glitch on the name */
    .glitch-r { animation: glitchR 4s infinite; }
    .glitch-b { animation: glitchB 4s infinite; }
    @keyframes glitchR {
      0%, 90%, 100% { transform: translate(0, 0); opacity: 0; }
      91% { transform: translate(-4px, 1px); opacity: 0.8; }
      93% { transform: translate(3px, -2px); opacity: 0.8; }
      95% { transform: translate(-2px, 0); opacity: 0.6; }
    }
    @keyframes glitchB {
      0%, 90%, 100% { transform: translate(0, 0); opacity: 0; }
      91% { transform: translate(4px, -1px); opacity: 0.8; }
      93% { transform: translate(-3px, 2px); opacity: 0.8; }
      95% { transform: translate(2px, 0); opacity: 0.6; }
    }

    .spin      { transform-origin: 1035px 170px; animation: spin 18s linear infinite; }
    .spin-rev  { transform-origin: 1035px 170px; animation: spin 26s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

    .bar { animation: grow 1.2s ease-out forwards; transform: scaleX(0); }
    .b1 { animation-delay: 3.8s; }
    .b2 { animation-delay: 4.0s; }
    .b3 { animation-delay: 4.2s; }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#03060F"/>
      <stop offset="55%" stop-color="#0A1326"/>
      <stop offset="100%" stop-color="#0E2A47"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9FDCFF"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.18"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soft"><feGaussianBlur stdDeviation="40"/></filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#58A6FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#000" fill-opacity="0.18"/>
    </pattern>

    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- background -->
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="1000" cy="60" r="180" fill="#00D4FF" opacity="0.12" filter="url(#soft)"/>
    <circle cx="200" cy="320" r="160" fill="#7B68EE" opacity="0.16" filter="url(#soft)"/>

    <!-- vertical scan sweep -->
    <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-80;340" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- floating particles -->
    <g fill="#00F0FF">
      <circle cx="120" cy="300" r="1.5"><animate attributeName="cy" values="340;-10" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="300" r="1"><animate attributeName="cy" values="340;-10" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="300" r="1.5"><animate attributeName="cy" values="340;-10" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="300" r="1"><animate attributeName="cy" values="340;-10" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="300" r="1.2"><animate attributeName="cy" values="340;-10" dur="11s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="300" r="1.5"><animate attributeName="cy" values="340;-10" dur="13s" begin="5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- HUD corner brackets -->
    <g stroke="url(#accent)" stroke-width="2" opacity="0.8">
      <path d="M24 60V24H60"/>
      <path d="M1140 24H1176V60"/>
      <path d="M24 280V316H60"/>
      <path d="M1176 280V316H1140"/>
    </g>

    <!-- top meta strip -->
    <text x="72" y="44" class="mono" font-size="12" fill="#58A6FF" opacity="0.7" letter-spacing="2">
      SYS://KYOTO.JP  ·  LAT 35.04  LON 135.78  ·  BUILD 2026.10
    </text>
    <g class="pulse">
      <circle cx="1112" cy="40" r="4" fill="#27C93F"/>
    </g>
    <text x="1060" y="44" class="mono" font-size="12" fill="#27C93F" letter-spacing="2">LIVE</text>

    <!-- name with glitch layers -->
    <g class="sans" font-size="80" font-weight="800" letter-spacing="4">
      <text x="68" y="138" fill="#FF2E88" class="glitch-r">Taka10</text>
      <text x="68" y="138" fill="#00F0FF" class="glitch-b">Taka10</text>
      <text x="68" y="138" fill="url(#nameFill)" filter="url(#glow)">Taka10</text>
    </g>

    <line x1="72" y1="160" x2="470" y2="160" stroke="url(#accent)" stroke-width="2"/>
    <rect x="72" y="156" width="10" height="8" fill="#00F0FF">
      <animate attributeName="x" values="72;460;72" dur="4s" repeatCount="indefinite"/>
    </rect>

    <text x="72" y="194" class="mono" font-size="22" fill="#58A6FF">
      Unity Developer / Gameplay Designer
    </text>
    <text x="72" y="224" class="mono" font-size="16" fill="#D2E3FF">
      UX Research ・ Web Development ・ AI Interaction
    </text>
    <text x="72" y="250" class="mono" font-size="15" fill="#8B949E">
      M.Eng. student @ Kyoto Institute of Technology
    </text>

    <!-- skill gauges -->
    <g class="mono" font-size="11" fill="#8B949E" letter-spacing="1">
      <text x="72" y="282">UNITY</text>
      <text x="72" y="300">UX</text>
      <text x="72" y="318">WEB</text>
    </g>
    <g>
      <rect x="130" y="274" width="260" height="6" rx="3" fill="#1B2A41"/>
      <rect x="130" y="292" width="260" height="6" rx="3" fill="#1B2A41"/>
      <rect x="130" y="310" width="260" height="6" rx="3" fill="#1B2A41"/>
      <rect x="130" y="274" width="235" height="6" rx="3" fill="url(#accent)" class="bar b1" style="transform-origin:130px 277px"/>
      <rect x="130" y="292" width="190" height="6" rx="3" fill="#7B68EE" class="bar b2" style="transform-origin:130px 295px"/>
      <rect x="130" y="310" width="175" height="6" rx="3" fill="#27C93F" class="bar b3" style="transform-origin:130px 313px"/>
    </g>

    <!-- terminal -->
    <g>
      <rect x="540" y="70" width="380" height="230" rx="14" fill="#0D1117" fill-opacity="0.9" stroke="#58A6FF" stroke-opacity="0.45"/>
      <path d="M540 84a14 14 0 0 1 14-14h352a14 14 0 0 1 14 14v18H540z" fill="#161B22"/>
      <circle cx="560" cy="87" r="5" fill="#FF5F56"/>
      <circle cx="578" cy="87" r="5" fill="#FFBD2E"/>
      <circle cx="596" cy="87" r="5" fill="#27C93F"/>
      <text x="660" y="91" class="mono" font-size="12" fill="#8B949E">taka10@kit: ~/profile</text>

      <defs>
        <clipPath id="c1"><rect x="560" y="112" width="0" height="26" class="type t1"/></clipPath>
        <clipPath id="c2"><rect x="560" y="140" width="0" height="26" class="type t2"/></clipPath>
        <clipPath id="c3"><rect x="560" y="168" width="0" height="26" class="type t3"/></clipPath>
        <clipPath id="c4"><rect x="560" y="196" width="0" height="26" class="type t4"/></clipPath>
        <clipPath id="c5"><rect x="560" y="224" width="0" height="26" class="type t5"/></clipPath>
        <clipPath id="c6"><rect x="560" y="252" width="0" height="26" class="type t6"/></clipPath>
      </defs>

      <g class="mono" font-size="15">
        <text x="562" y="130" fill="#58A6FF" clip-path="url(#c1)">$ ./boot --profile taka10</text>
        <text x="562" y="158" fill="#E6EDF3" clip-path="url(#c2)">[ OK ] Unity Engine linked</text>
        <text x="562" y="186" fill="#B392F0" clip-path="url(#c3)">[ OK ] UX research module</text>
        <text x="562" y="214" fill="#00D4FF" clip-path="url(#c4)">[ OK ] AI interaction core</text>
        <text x="562" y="242" fill="#FFBD2E" clip-path="url(#c5)">[ ★ ] BitSummit GameJam Award</text>
        <text x="562" y="270" fill="#27C93F" clip-path="url(#c6)">&gt; STATUS: ONLINE</text>
      </g>
      <g class="line l6">
        <rect x="700" y="257" width="9" height="16" fill="#27C93F" class="cursor"/>
      </g>
    </g>

    <!-- radar / orbit -->
    <g>
      <circle cx="1035" cy="170" r="92" stroke="#58A6FF" stroke-opacity="0.25"/>
      <circle cx="1035" cy="170" r="62" stroke="#58A6FF" stroke-opacity="0.2"/>
      <circle cx="1035" cy="170" r="32" stroke="#58A6FF" stroke-opacity="0.2"/>
      <line x1="943" y1="170" x2="1127" y2="170" stroke="#58A6FF" stroke-opacity="0.15"/>
      <line x1="1035" y1="78" x2="1035" y2="262" stroke="#58A6FF" stroke-opacity="0.15"/>

      <g class="spin-rev">
        <circle cx="1035" cy="170" r="76" stroke="#00F0FF" stroke-opacity="0.6" stroke-dasharray="4 10"/>
      </g>

      <g class="spin">
        <path d="M1035 170L1035 78A92 92 0 0 1 1114.7 124z" fill="#00F0FF" fill-opacity="0.12"/>
        <line x1="1035" y1="170" x2="1035" y2="78" stroke="#00F0FF" stroke-width="1.5"/>
        <circle cx="1035" cy="108" r="4" fill="#FF2E88" filter="url(#glow)"/>
      </g>

      <circle cx="1068" cy="130" r="3" fill="#27C93F" class="pulse"/>
      <circle cx="990" cy="205" r="3" fill="#FFBD2E" class="pulse"/>
      <circle cx="1035" cy="170" r="5" fill="#00F0FF" filter="url(#glow)"/>

      <text x="1035" y="290" text-anchor="middle" class="mono" font-size="11" fill="#58A6FF" letter-spacing="3">SCANNING IDEAS…</text>
    </g>

    <!-- CRT scanlines -->
    <rect width="1200" height="340" fill="url(#dots)" opacity="0.5"/>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" stroke="#58A6FF" stroke-opacity="0.35"/>
</svg>
